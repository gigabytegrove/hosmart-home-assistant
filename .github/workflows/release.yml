name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/hosmart/manifest.json").read_text())
          print(manifest["version"])
          PY
          )"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require detailed release notes
        run: python scripts/validate_release_notes.py

      - name: Publish documented GitHub release and repair existing notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE=".github/release-notes/v${VERSION}.md"

          # Never publish changelog-only/generated release notes.
          test -s "$NOTES_FILE" || {
            echo "Missing curated release notes for $TAG" >&2
            exit 1
          }

          # Do not publish a superseded commit or replace existing notes
          # from an older revision that has not been validated against main.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]]; then
            echo "Skipping release from outdated validated commit."
            exit 0
          fi

          # Backfill older published releases whose initial bodies were just
          # an auto-generated changelog. Never create a historical release.
          for notes in .github/release-notes/v*.md; do
            note_tag="$(basename "$notes" .md)"
            if gh release view "$note_tag" >/dev/null 2>&1; then
              published_body="$(gh release view "$note_tag" --json body --jq .body)"
              intended_body="$(cat "$notes")"
              if [[ "$published_body" != "$intended_body" ]]; then
                gh release edit "$note_tag" \
                  --title "Ho-Smart for Home Assistant $note_tag" \
                  --notes-file "$notes"
                echo "Updated descriptive release notes for $note_tag."
              fi
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Documented release $TAG already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$VALIDATED_SHA" \
            --title "Ho-Smart for Home Assistant $TAG" \
            --notes-file "$NOTES_FILE"
