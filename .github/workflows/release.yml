name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/hosmart/manifest.json").read_text())
          print(manifest["version"])
          PY
          )"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected version: $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish documented GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES_FILE=".github/release-notes/v${VERSION}.md"

          # If an earlier workflow already published this version with
          # generated notes, replace its body with the curated release notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "$TAG" \
                --title "Ho-Smart for Home Assistant $TAG" \
                --notes-file "$NOTES_FILE"
              echo "Updated documented release $TAG."
            else
              echo "Release $TAG already exists; no curated notes for this version."
            fi
            exit 0
          fi

          # Do not publish superseded code when a newer main commit
          # has not yet passed its own validation.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$VALIDATED_SHA" ]]; then
            echo "Skipping release from outdated validated commit."
            exit 0
          fi

          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$TAG" \
              --target "$VALIDATED_SHA" \
              --title "Ho-Smart for Home Assistant $TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --target "$VALIDATED_SHA" \
              --title "Ho-Smart for Home Assistant $TAG" \
              --generate-notes
          fi
