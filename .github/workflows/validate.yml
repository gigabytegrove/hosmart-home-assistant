name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python + Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile Python
        run: python -m compileall -q custom_components/hosmart
      - name: Verify substantive GitHub Release notes
        run: python scripts/validate_release_notes.py
      - name: Verify release-facing documentation is current
        run: |
          python scripts/validate_release_documentation.py
          python -m unittest discover -s tests -p test_release_documentation.py
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
