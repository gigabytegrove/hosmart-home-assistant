name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python + Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile Python
        run: python -m compileall -q custom_components/hosmart
      - name: Test quiet-hours scheduling
        run: python -m unittest discover -s tests -p test_night_schedule.py
      - name: Test per-channel quiet-hours precedence
        run: python -m unittest discover -s tests -p test_channel_quiet.py
      - name: Test diagnostic privacy
        run: python -m unittest discover -s tests -p test_debug_privacy.py
      - name: Test direct quiet-hours options persistence
        run: python -m unittest discover -s tests -p test_quiet_settings.py
      - name: Verify substantive GitHub Release notes
        run: python scripts/validate_release_notes.py
      - name: Verify release-facing documentation is current
        run: |
          python scripts/validate_release_documentation.py
          python -m unittest discover -s tests -p test_release_documentation.py
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  homeassistant-2026-11:
    name: Home Assistant Core 2026.11.1 import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install 'homeassistant==2026.11.1'
      - run: python -c 'import custom_components.hosmart; import custom_components.hosmart.config_flow; import custom_components.hosmart.coordinator; print("Ho-Smart HA Core 2026.11.1 imports passed")'
